<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <a class="mobile-nav-brand" href="{{ '/' | relative_url }}#about-me">Qimao Chen</a>
      <nav id="site-nav" class="greedy-nav">
        <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-controls="mobile-navigation" aria-expanded="false">
          <span class="mobile-nav-toggle__label">Menu</span>
          <span class="mobile-nav-toggle__icon" aria-hidden="true">
            <span></span>
            <span></span>
          </span>
        </button>
        <ul id="mobile-navigation" class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <div class="mobile-nav-backdrop" aria-hidden="true"></div>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
